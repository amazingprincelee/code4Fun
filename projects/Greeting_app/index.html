<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
          
          body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
          }

          .container {
            border: 2px solid orange;
            width: 40%;
            padding: 30px;
            font-size: 2rem;
            border-radius: 20px;
          }

          input {
            display: inline-block;
            width: 100%;
            height: 25px;
          }

          [placeholder]{
            padding-left: 10px;
          }

          button {
            height: 25px;
          }

    </style>

</head>
<body>

    <div class="container">
        
        <div class="name-container">
            <input type="text" placeholder="I beg submit you name here">
            <button onclick="submitName()">Submit</button>
        </div>

        <div class="message-container">
            <p id="greeting">Good morning Jebrudaya</p>
            <p id="message">I hope say u sleep well, enjoy your day 😊</p>
        </div>


    </div>

    <script>
         
         const hours =  new Date().getHours();
         let name;
           
           function submitName (){
              const setName = document.querySelector('input').value;
                name = setName;
                updateGreeting();
               document.querySelector('.name-container').style.display = "none"
           }

           function updateGreeting(){
            if(hours < 12){
            document.querySelector('#greeting').innerHTML = "Good morning " + name;
            const body = document.querySelector('body')
            body.style.background = "blue";
            body.style.color = "white";

           }else if(hours >= 12 && hours < 17){
             document.querySelector('#greeting').innerHTML = "Good Afternoon " + name + " 😆";
             document.querySelector("#message").innerHTML = "I hope say every thing dey kamkpe! ☀️";
             const body = document.querySelector('body')
            body.style.background = "yellow";
            body.style.color = "black";
           }else{
            document.querySelector('#greeting').innerHTML = "Good Night " + name + " 😆";
            document.querySelector("#message").innerHTML = "Well done O, make u sleep well O 🌙";
            const body = document.querySelector('body')
            body.style.background = "black";
            body.style.color = "white";

           }

           }
           

           
         

    </script>
    
</body>
</html>
